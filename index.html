<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Чек-лист УЗ-мониторинга ателектазов</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body { font-family: sans-serif; padding: 20px; background-color: #f4f4f4; }
    .section { background: #fff; padding: 15px; border-radius: 8px; margin-bottom: 20px; }
    .hidden { display: none; }
    label { display: block; margin: 8px 0 4px; }
    input[type="text"], input[type="number"], select { width: 100%; padding: 8px; box-sizing: border-box; }
    button { padding: 10px 20px; margin: 6px 4px 0 0; border: none; border-radius: 5px; background: #0088cc; color: #fff; cursor: pointer; }
    .btn-secondary { background: #666; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
    .incomplete { background-color: #fdd; }
  </style>
</head>
<body>
  <!-- Шаг 1: Ввод пациента -->
  <div id="step1" class="section">
    <h2>Исходные данные</h2>
    <label for="block_select">Исследователь:</label>
    <select id="block_select">
      <option value="Щепарев">Щепарев</option>
      <option value="Литвинов">Литвинов</option>
      <option value="Мухаммалиева">Мухаммалиева</option>
    </select>

    <label for="datetime">Дата и время:</label>
    <input type="text" id="datetime" readonly />

    <label for="patient_id">Номер И/Б (ID пациента):</label>
    <input type="text" id="patient_id" placeholder="ID пациента" />

    <label for="patient_name">Ф.И.О. пациента:</label>
    <input type="text" id="patient_name" placeholder="Иванов Иван Иванович" />

    <div style="margin-top:20px;">
      <button id="new_patient">Новый пациент</button>
      <button id="to_list" class="btn-secondary">К списку пациентов</button>
    </div>
  </div>

  <!-- Страница списка пациентов -->
  <div id="patient_list" class="section hidden">
    <h2>Список пациентов</h2>
    <div>
      <button id="btn_all">Все пациенты</button>
      <button id="btn_recent" class="btn-secondary">
        Последние пациенты <small id="recent_note"></small>
      </button>
    </div>
    <table id="tbl_patients">
      <thead><tr><th>ID</th><th>Ф.И.О.</th><th>Исследователь</th><th>Время</th><th>Действие</th></tr></thead>
      <tbody></tbody>
    </table>
  </div>

  <!-- Протокол пациента -->
  <div id="protocol_form" class="section hidden">
    <h2>Протокол пациента</h2>
    <p>Исследователь: <span id="hdr_researcher"></span></p>
    <p>Пациент: <span id="hdr_patient_name"></span></p>
    <p>ID: <span id="hdr_patient_id"></span></p>

    <label for="gender">Пол:</label>
    <select id="gender"><option value="М">М</option><option value="Ж">Ж</option></select>

    <label for="age">Возраст (лет):</label>
    <input type="number" id="age" min="0" />

    <label for="height">Рост (см):</label>
    <input type="number" id="height" min="0" />

    <label for="weight">Вес (кг):</label>
    <input type="number" id="weight" min="0" />

    <div style="margin-top:20px;">
      <button id="save_protocol">Сохранить</button>
      <button id="back_to_list" class="btn-secondary">Назад</button>
    </div>
  </div>

  <script>
    const webApp = Telegram.WebApp;
    webApp.ready();

    let currentList = [];
    const formData = {};

    // Установить дату/время при загрузке
    document.addEventListener('DOMContentLoaded', () => {
      const now = new Date();
      document.getElementById('datetime').value = now.toLocaleString('ru-RU');
    });

    // Новый пациент → Сохранить базовые данные и открыть протокол
    document.getElementById('new_patient').addEventListener('click', () => {
      formData.researcher = document.getElementById('block_select').value;
      formData.datetime   = document.getElementById('datetime').value;
      formData.patient_id   = document.getElementById('patient_id').value.trim();
      formData.patient_name = document.getElementById('patient_name').value.trim();
      // TODO: google.script.run.savePatient(formData);
      openProtocol();
    });

    // К списку пациентов
    document.getElementById('to_list').addEventListener('click', () => {
      document.getElementById('step1').classList.add('hidden');
      const researcher = document.getElementById('block_select').value;
      const datePart   = document.getElementById('datetime').value.split(',')[0];
      document.getElementById('recent_note').textContent = `(от ${researcher} за ${datePart})`;
      loadAllPatients();
    });

    // Показать всех
    document.getElementById('btn_all').addEventListener('click', () => loadAllPatients());
    // Показать за сегодня
    document.getElementById('btn_recent').addEventListener('click', () => loadRecentPatients());

    // Загрузить всех пациентов
    function loadAllPatients() {
      // TODO: google.script.run.withSuccessHandler(renderList).getAllPatients();
      console.log('getAllPatients');
    }
    // Загрузить последних пациентов
    function loadRecentPatients() {
      // TODO: google.script.run.withSuccessHandler(renderList)
      //    .getRecentPatients(formData.researcher, document.getElementById('datetime').value.split(',')[0]);
      console.log('getRecentPatients');
    }

    // Отобразить список
    function renderList(patients) {
      currentList = patients;
      const tbody = document.querySelector('#tbl_patients tbody');
      tbody.innerHTML = '';
      patients.forEach(p => {
        const tr = document.createElement('tr');
        // Если хоть одно поле протокола не заполнено, подсветить
        if (!p.gender || !p.age || !p.height || !p.weight) tr.classList.add('incomplete');
        tr.innerHTML = `
          <td>${p.patient_id}</td>
          <td>${p.patient_name}</td>
          <td>${p.researcher}</td>
          <td>${new Date(p.datetime).toLocaleString('ru-RU')}</td>
          <td><button onclick="editPatient('${p.patient_id}')">Редактировать</button></td>
        `;
        tbody.appendChild(tr);
      });
      document.getElementById('patient_list').classList.remove('hidden');
    }

    // Редактировать пациента
    function editPatient(id) {
      const rec = currentList.find(r => r.patient_id === id);
      if (!rec) return;
      // Заполнить заголовок и поля
      formData.researcher  = rec.researcher;
      formData.datetime    = rec.datetime;
      formData.patient_id   = rec.patient_id;
      formData.patient_name = rec.patient_name;
      openProtocol(rec);
    }

    // Открыть форму протокола
    function openProtocol(data={}) {
      document.getElementById('step1').classList.add('hidden');
      document.getElementById('patient_list').classList.add('hidden');
      document.getElementById('protocol_form').classList.remove('hidden');
      document.getElementById('hdr_researcher').textContent = formData.researcher;
      document.getElementById('hdr_patient_name').textContent = formData.patient_name;
      document.getElementById('hdr_patient_id').textContent = formData.patient_id;
      // Если при редактировании, подставить значения
      document.getElementById('gender').value = data.gender || 'М';
      document.getElementById('age').value    = data.age || '';
      document.getElementById('height').value = data.height || '';
      document.getElementById('weight').value = data.weight || '';
    }

    // Сохранить протокол и вернуться к списку
    document.getElementById('save_protocol').addEventListener('click', () => {
      formData.gender = document.getElementById('gender').value;
      formData.age    = document.getElementById('age').value;
      formData.height = document.getElementById('height').value;
      formData.weight = document.getElementById('weight').value;
      // TODO: google.script.run.saveProtocol(formData);
      document.getElementById('protocol_form').classList.add('hidden');
      loadAllPatients();
    });

    // Назад к списку
    document.getElementById('back_to_list').addEventListener('click', () => {
      document.getElementById('protocol_form').classList.add('hidden');
      document.getElementById('patient_list').classList.remove('hidden');
    });
  </script>
</body>
</html>
